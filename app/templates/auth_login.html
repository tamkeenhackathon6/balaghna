<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-100 text-slate-800" dir="rtl">
    <main class="min-h-screen flex items-center justify-center p-6">
      <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
        <div class="bg-sky-700 px-6 py-5 text-white">
          <p class="text-sm font-semibold">BALIGHNA | بلّغنا</p>
          <h1 class="mt-2 text-2xl font-bold">بلّغنا، والباقي علينا</h1>
        </div>

        <form method="post" action="/login" class="p-6 space-y-5">
          {% if error %}
          <div class="rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700">{{ error }}</div>
          {% endif %}

          <div>
            <label for="email" class="mb-2 block text-sm font-medium text-slate-700">البريد الإلكتروني</label>
            <input id="email" name="email" type="email" required class="w-full rounded-lg border border-slate-300 px-3 py-2.5 focus:border-sky-500 focus:outline-none" placeholder="name@example.com" />
          </div>

          <div>
            <label for="password" class="mb-2 block text-sm font-medium text-slate-700">كلمة المرور</label>
            <input id="password" name="password" type="password" required class="w-full rounded-lg border border-slate-300 px-3 py-2.5 focus:border-sky-500 focus:outline-none" placeholder="••••••••" />
          </div>

          <button type="submit" class="w-full rounded-lg bg-sky-700 px-4 py-3 font-semibold text-white transition hover:bg-sky-800">تسجيل الدخول</button>

          <div class="text-center text-sm text-slate-600">
            ليس لديك حساب؟
            <a href="/register" class="font-semibold text-sky-700">إنشاء حساب جديد</a>
          </div>

          <div class="rounded-lg bg-slate-50 border border-slate-200 p-3 text-xs text-slate-600 space-y-1">
            <p>حسابات تجريبية:</p>
            <p>admin@example.com / password</p>
            <p>citizen@example.com / password</p>
          </div>
        </form>
      </div>
    </main>
  </body>
</html>
