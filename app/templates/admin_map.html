<!DOCTYPE html>
{% set lang = current_language(request) %}<html lang="{{ lang }}" dir="{{ 'rtl' if lang == 'ar' else 'ltr' }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/ministry-theme.css" />
    <style>
      #complaint-map { height: min(68vh, 680px); min-height: 430px; }
    </style>
  </head>
  <body class="text-slate-800" dir="{{ 'rtl' if lang == 'ar' else 'ltr' }}">
    <nav class="ministry-nav text-white">
      <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4">
        <a href="/"><img class="ministry-logo" src="/static/images/horizntal-logo.png" alt="Ministry logo" /></a>
        <div class="flex items-center gap-3">
          <a href="/admin" class="rounded-lg border border-white/60 px-4 py-2 text-sm font-medium hover:bg-white/10">لوحة الإدارة</a>
          <a href="/admin/complaints" class="rounded-lg border border-white/60 px-4 py-2 text-sm font-medium hover:bg-white/10">إدارة البلاغات</a>
          <!-- <a href="/set-language/{{ 'en' if lang == 'ar' else 'ar' }}" class="rounded-lg border border-white/60 px-3 py-2">{{ 'EN' if lang == 'ar' else 'العربية' }}</a> -->
          <form method="post" action="/logout">
            <button type="submit" class="rounded-lg border border-white/60 px-4 py-2 text-sm font-medium hover:bg-white/10">تسجيل الخروج</button>
          </form>
        </div>
      </div>
    </nav>

    <main class="mx-auto max-w-7xl px-6 py-8">
      <div class="mb-6 flex flex-col gap-4 md:flex-row md:items-end md:justify-between">
        <div>
          <p class="text-sm text-sky-700">التجربة الجغرافية للإدارة</p>
          <h1 class="text-3xl font-bold">الخريطة التفاعلية للبلاغات</h1>
        </div>
        <p class="text-sm text-slate-600">تُعرض البلاغات التي تحتوي على إحداثيات فقط.</p>
      </div>

      <section class="mb-6 grid gap-4 md:grid-cols-4">
        <div class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm">
          <p class="text-sm text-slate-500">عدد البلاغات المعروضة</p>
          <p id="displayed-count" class="mt-2 text-3xl font-bold text-sky-700">0</p>
        </div>
        <div class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm">
          <p class="text-sm text-slate-500">البلاغات العاجلة</p>
          <p id="urgent-count" class="mt-2 text-3xl font-bold text-rose-600">0</p>
        </div>
        <div class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm">
          <p class="text-sm text-slate-500">قيد المعالجة</p>
          <p id="in-progress-count" class="mt-2 text-3xl font-bold text-amber-600">0</p>
        </div>
        <div class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm">
          <p class="text-sm text-slate-500">بانتظار التوجيه</p>
          <p id="pending-routing-count" class="mt-2 text-3xl font-bold text-violet-700">0</p>
        </div>
      </section>

      <section class="mb-6 rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
        <form id="map-filters" class="grid gap-4 md:grid-cols-5">
          <div>
            <label for="category" class="mb-2 block text-sm font-medium text-slate-700">النوع</label>
            <select id="category" name="category" class="w-full rounded-lg border border-slate-300 px-3 py-2">
              <option value="">الكل</option>
              {% for category in categories %}
              <option value="{{ category.id }}">{{ category.name }}</option>
              {% endfor %}
            </select>
          </div>
          <div>
            <label for="priority" class="mb-2 block text-sm font-medium text-slate-700">الأولوية</label>
            <select id="priority" name="priority" class="w-full rounded-lg border border-slate-300 px-3 py-2">
              <option value="">الكل</option>
              {% for value in ['low','medium','high','urgent'] %}<option value="{{ value }}">{{ priority_label(value, request) }}</option>{% endfor %}
            </select>
          </div>
          <div>
            <label for="status" class="mb-2 block text-sm font-medium text-slate-700">الحالة</label>
            <select id="status" name="status" class="w-full rounded-lg border border-slate-300 px-3 py-2">
              <option value="">الكل</option>
              {% for value in ['new','assigned','in_progress','resolved','closed'] %}<option value="{{ value }}">{{ status_label(value, request) }}</option>{% endfor %}
            </select>
          </div>
          <div>
            <label for="department" class="mb-2 block text-sm font-medium text-slate-700">الجهة المختصة</label>
            <select id="department" name="department" class="w-full rounded-lg border border-slate-300 px-3 py-2">
              <option value="">الكل</option>
              {% for department in departments %}
              <option value="{{ department.id }}">{{ department.name }}</option>
              {% endfor %}
            </select>
          </div>
          <div>
            <label for="governorate" class="mb-2 block text-sm font-medium text-slate-700">المحافظة</label>
            <select id="governorate" name="governorate" class="w-full rounded-lg border border-slate-300 px-3 py-2">
              <option value="">الكل</option>
              {% for governorate in governorates %}
              <option value="{{ governorate }}">{{ governorate }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="md:col-span-5 flex justify-end gap-3">
            <button type="submit" class="rounded-lg bg-sky-700 px-4 py-2 font-semibold text-white hover:bg-sky-800">تطبيق الفلاتر</button>
            <button id="reset-filters" type="button" class="rounded-lg border border-slate-300 bg-white px-4 py-2 font-semibold text-slate-700 hover:bg-slate-50">إعادة ضبط</button>
          </div>
        </form>
      </section>

      <section class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
        <div id="complaint-map"></div>
      </section>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
      const map = L.map('complaint-map').setView([33.5138, 36.2765], 11);
      const markers = L.layerGroup().addTo(map);
      const form = document.getElementById('map-filters');

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);

      function popupContent(complaint) {
        const department = complaint.department_label;
        return `
          <div dir="rtl" class="min-w-56 text-right text-sm text-slate-800">
            <div class="mb-2 font-bold">#${complaint.id} ${complaint.title}</div>
            <div><strong>رقم البلاغ:</strong> #${complaint.id}</div>
            <div><strong>العنوان:</strong> ${complaint.address || 'غير محدد'}</div>
            <div><strong>النوع:</strong> ${complaint.category || 'غير محدد'}</div>
            <div><strong>{{ t('priority', request) }}:</strong> ${complaint.priority_label}</div>
            <div><strong>{{ t('status', request) }}:</strong> ${complaint.status_label}</div>
            <div><strong>الجهة المختصة:</strong> ${department}</div>
            <div><strong>المنطقة:</strong> ${complaint.area || 'غير محدد'}</div>
            <div><strong>{{ t('governorate', request) }}:</strong> ${complaint.governorate_label || '—'}</div>
            <a href="/admin/complaints/${complaint.id}" class="mt-3 inline-block font-semibold text-sky-700">فتح البلاغ</a>
          </div>`;
      }

      function updateSummary(complaints) {
        document.getElementById('displayed-count').textContent = complaints.length;
        document.getElementById('urgent-count').textContent = complaints.filter((item) => item.priority === 'urgent').length;
        document.getElementById('in-progress-count').textContent = complaints.filter((item) => ['assigned', 'in_progress'].includes(item.status)).length;
        document.getElementById('pending-routing-count').textContent = complaints.filter((item) => !item.department).length;
      }

      async function loadComplaints() {
        const query = new URLSearchParams(new FormData(form));
        for (const [key, value] of [...query.entries()]) {
          if (!value) query.delete(key);
        }

        const response = await fetch(`/api/map/complaints?${query.toString()}`);
        if (!response.ok) return;

        const complaints = await response.json();
        markers.clearLayers();
        const bounds = [];
        complaints.forEach((complaint) => {
          const marker = L.marker([complaint.latitude, complaint.longitude]);
          marker.bindPopup(popupContent(complaint));
          marker.addTo(markers);
          bounds.push([complaint.latitude, complaint.longitude]);
        });
        updateSummary(complaints);
        if (bounds.length) map.fitBounds(bounds, { padding: [35, 35], maxZoom: 14 });
      }

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        loadComplaints();
      });
      document.getElementById('reset-filters').addEventListener('click', () => {
        form.reset();
        loadComplaints();
      });
      loadComplaints();
    </script>
  </body>
</html>
