<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title }}</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="/static/css/ministry-theme.css"></head><body>{% include 'partials/app_header.html' %}<main class="mx-auto max-w-5xl px-6 py-10"><h1 class="text-3xl font-bold">مهامي الحالية</h1><div class="mt-6 space-y-4">{% for task in tasks %}<a class="block ministry-card p-5" href="/employee/tasks/{{ task.id }}"><h2 class="font-bold">#{{ task.id }} {{ task.title }}</h2><p class="mt-2">{{ task.department.name if task.department else '' }} · {{ status_label(task.status, request) }}</p></a>{% else %}<div class="ministry-card p-6">لا توجد مهام مخصصة.</div>{% endfor %}</div></main></body></html>
